name: Greeny Emission Bot

on: [pull_request]
permissions:
  pull-requests: write  # 
jobs:
  measure-energy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install CodeCarbon
        run: pip install codecarbon

      - name: Run script and capture emissions
        run: |
          python script.py > output.txt

      - name: Extract energy and comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🟢 **Energy Score: A**
            Estimated Usage: `$(cat output.txt | grep Emissions | cut -d ":" -f2)` kWh  
            Measured by: CodeCarbon
