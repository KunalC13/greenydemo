name: Greeny Emission Bot

on: [pull_request]

permissions:
  pull-requests: write

jobs:
  measure-energy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install CodeCarbon
        run: pip install codecarbon

      - name: Run script and capture emissions
        run: |
          python script.py > output.txt
          grep "Emissions" output.txt | cut -d ":" -f2 | xargs > emissions_value.txt

      - name: Comment PR with energy score
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🟢 **Energy Score: A**
            Estimated Usage: `${{ steps.read_emission.outputs.value }}` kWh  
            Measured by: CodeCarbon
        env:
          EMISSION_VALUE: ${{ steps.read_emission.outputs.value }}
        id: comment

      - name: Read emission value
        id: read_emission
        run: |
          echo "::set-output name=value::$(cat emissions_value.txt)"
